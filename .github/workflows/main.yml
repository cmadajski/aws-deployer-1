name: AWS ECS Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: "aws-deployer-1"
  IAM_ROLE_ARN: "arn:aws:iam::753520288508:role/aws-deployer-1"
  TERRAFORM_DIR: "./terraform"

# Permissions are required for OIDC authentication with AWS
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ TERRAFORM_VERSION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image with Kaniko (arm64)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v $HOME/.docker/config.json:/kaniko/.docker/config.json:ro \
            gcr.io/kaniko-project/executor:latest \
            --context dir:///workspace \
            --dockerfile dir:///workspace/Dockerfile \
            --destination $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
            --custom-platform linux/arm64 \
            --cache=true

      - name: Terraform Init
        run: terraform init
          working-directory: ${{ TERRAFORM_DIR }}

      - name: Terraform Plan
        run: terraform plan -var="image_tag=${{ github.sha }}" -out=tfplan
          working-directory: ${{ TERRAFORM_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
          working-directory: ${{ TERRAFORM_DIR }}
